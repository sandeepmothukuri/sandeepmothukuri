<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-labelledby="t d">
  <title id="t">SOC Live Telemetry — 6 data sources</title>
  <desc id="d">Professional live telemetry dashboard showing event volume and sparklines for 6 SOC data sources.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#070d1a"/>
      <stop offset="0.5" stop-color="#0a1929"/>
      <stop offset="1" stop-color="#040810"/>
    </linearGradient>
    <linearGradient id="pnl" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#132f4c" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0a1929" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#1f6feb"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#1f3b55" stroke-width="1" opacity="0.22"/>
    </pattern>
    <filter id="g"><feGaussianBlur stdDeviation="2"/></filter>
    <style>
      .f { font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
      .m { font-family: SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace; }
      .ttl { font-size: 13px; font-weight: 800; fill: #f0f6fc; letter-spacing: 1.4px; }
      .lbl { font-size: 9px; fill: #8ba3bd; letter-spacing: 1.4px; font-weight: 700; }
      .sm  { font-size: 9px; fill: #8ba3bd; letter-spacing: 0.3px; }
      .num { font-size: 18px; font-weight: 800; fill: #f0f6fc; }
      .unit { font-size: 9px; fill: #8ba3bd; letter-spacing: 0.4px; }
      .pnl { fill: url(#pnl); stroke: #1f3b55; stroke-width: 1; }
      .card { fill: #0d2233; stroke: #1f3b55; stroke-width: 0.8; }
      .live { animation: live 1.8s steps(2) infinite; }
      .pls1 { animation: pls 3.4s ease-in-out infinite; }
      .pls2 { animation: pls 3.4s ease-in-out infinite 0.4s; }
      .pls3 { animation: pls 3.4s ease-in-out infinite 0.8s; }
      .pls4 { animation: pls 3.4s ease-in-out infinite 1.2s; }
      .pls5 { animation: pls 3.4s ease-in-out infinite 1.6s; }
      .pls6 { animation: pls 3.4s ease-in-out infinite 2.0s; }
      .blink { animation: blink 1.6s steps(2) infinite; }
      .scan { animation: scan 9s linear infinite; }
      @keyframes live { 0%,49% { opacity: 1 } 50%,100% { opacity: 0.3 } }
      @keyframes pls  { 0%,100% { opacity: 0.4 } 50% { opacity: 1 } }
      @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0.35 } }
      @keyframes scan { 0% { transform: translateX(-200px); opacity: 0 } 5% { opacity: 0.6 } 95% { opacity: 0.6 } 100% { transform: translateX(1200px); opacity: 0 } }
    </style>
  </defs>

  <rect width="1200" height="150" fill="url(#bg)"/>
  <rect width="1200" height="150" fill="url(#grid)" opacity="0.6"/>

  <!-- Outer panel -->
  <rect x="20" y="12" width="1160" height="126" rx="12" class="pnl"/>

  <!-- Header strip -->
  <g class="f">
    <text x="40" y="32" class="ttl">LIVE TELEMETRY  ·  6 DATA SOURCES</text>
    <g transform="translate(990 18)">
      <rect width="170" height="22" rx="6" fill="#0d2233" stroke="#1f6feb"/>
      <circle cx="14" cy="11" r="4" fill="#3fb950" class="live" filter="url(#g)"/>
      <text x="26" y="15" class="sm" letter-spacing="1.2" fill="#3fb950" font-weight="700">ALL SOURCES · ONLINE</text>
    </g>
  </g>

  <!-- Animated scan beam under header -->
  <rect x="-200" y="42" width="200" height="2" fill="#58a6ff" class="scan" opacity="0.6"/>

  <!-- 6 telemetry cards: SIEM · EDR · IAM · NET · CLOUD · SOAR -->
  <g class="f" transform="translate(30 50)">

