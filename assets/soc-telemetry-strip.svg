        <rect x="96"  y="4"  width="6" height="16" rx="1"/>
        <rect x="104" y="7"  width="6" height="13" rx="1"/>
        <rect x="112" y="10" width="6" height="10" rx="1"/>
        <rect x="120" y="6"  width="6" height="14" rx="1"/>
        <rect x="128" y="3"  width="6" height="17" rx="1"/>
        <rect x="136" y="1"  width="6" height="19" rx="1"/>
        <rect x="144" y="5"  width="6" height="15" rx="1"/>
        <rect x="152" y="8"  width="6" height="12" rx="1"/>
      </g>
    </g>

    <!-- EDR -->
    <g transform="translate(190 0)">
      <rect width="186" height="78" rx="8" class="card"/>
      <text x="14" y="16" class="lbl">EDR · ENDPOINT</text>
      <circle cx="172" cy="14" r="3.5" fill="#58a6ff" class="pls2" filter="url(#g)"/>
      <text x="14" y="40" class="num m">8.2<tspan class="unit"> K/min</tspan></text>
      <g transform="translate(14 50)" fill="url(#bar)">
        <rect x="0"   y="10" width="6" height="10" rx="1"/>
        <rect x="8"   y="7"  width="6" height="13" rx="1"/>
