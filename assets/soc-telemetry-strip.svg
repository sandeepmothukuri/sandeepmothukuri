      <rect width="186" height="78" rx="8" class="card"/>
      <text x="14" y="16" class="lbl">SIEM</text>
      <circle cx="172" cy="14" r="3.5" fill="#58a6ff" class="pls1" filter="url(#g)"/>
      <text x="14" y="40" class="num m">12.4<tspan class="unit"> K/min</tspan></text>
      <g transform="translate(14 50)" fill="url(#bar)">
        <rect x="0"   y="14" width="6" height="6"  rx="1"/>
