  <!-- Footer stats line -->
  <g class="f" transform="translate(40 142)">
    <text class="sm" fill="#8ba3bd">▸ TOTAL INGEST:</text>
    <text class="m" font-size="10" font-weight="800" fill="#58a6ff" x="100">2.4M events/day</text>
    <text class="sm" fill="#8ba3bd" x="200">·  alerts triaged:</text>
    <text class="m" font-size="10" font-weight="800" fill="#3fb950" x="290">247/24h</text>
    <text class="sm" fill="#8ba3bd" x="350">·  MTTD:</text>
    <text class="m" font-size="10" font-weight="800" fill="#3fb950" x="392">4m 12s</text>
    <text class="sm" fill="#8ba3bd" x="448">·  uptime:</text>
    <text class="m" font-size="10" font-weight="800" fill="#3fb950" x="498">99.94%</text>
    <text class="sm" fill="#8ba3bd" x="940">last refresh: 2026-05-11 · 22:48 UTC</text>
