        <rect x="144" y="4"  width="6" height="16" rx="1"/>
        <rect x="152" y="1"  width="6" height="19" rx="1"/>
      </g>
    </g>

    <!-- CLOUD -->
    <g transform="translate(760 0)">
      <rect width="186" height="78" rx="8" class="card"/>
      <text x="14" y="16" class="lbl">CLOUD · CSPM</text>
      <circle cx="172" cy="14" r="3.5" fill="#58a6ff" class="pls5" filter="url(#g)"/>
      <text x="14" y="40" class="num m">3.6<tspan class="unit"> K/min</tspan></text>
      <g transform="translate(14 50)" fill="url(#bar)">
        <rect x="0"   y="11" width="6" height="9"  rx="1"/>
