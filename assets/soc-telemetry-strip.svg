<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-labelledby="title desc">
  <title id="title">SOC telemetry strip</title>
  <desc id="desc">A cybersecurity telemetry strip with SIEM, endpoint, identity, network, cloud, and automation signals.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07101d"/>
      <stop offset="0.55" stop-color="#0a1727"/>
      <stop offset="1" stop-color="#06151a"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" x2="1">
      <stop offset="0" stop-color="#36d1dc"/>
      <stop offset="0.42" stop-color="#58a6ff"/>
      <stop offset="0.78" stop-color="#7ee787"/>
      <stop offset="1" stop-color="#ffcf5a"/>
    </linearGradient>
    <filter id="glow" x="-25%" y="-80%" width="150%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#1f3b55" stroke-width="1" opacity="0.2"/>
    </pattern>
    <style>
      .font { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; }
      .mono { font-family: SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace; }
      .dash { stroke-dasharray: 10 14; animation: dash 8s linear infinite; }
      .pulse { animation: pulse 2.6s ease-in-out infinite; }
      .pulse2 { animation: pulse 3.2s ease-in-out infinite .5s; }
      .scan { animation: scan 4.5s ease-in-out infinite; }
      .line1 { animation: swap 9s steps(1, end) infinite; }
      .line2 { animation: swap 9s steps(1, end) infinite 3s; opacity: 0; }
      .line3 { animation: swap 9s steps(1, end) infinite 6s; opacity: 0; }
      @keyframes dash { to { stroke-dashoffset: -220; } }
      @keyframes pulse { 0%,100% { opacity: .46; } 50% { opacity: 1; } }
      @keyframes scan { 0%,100% { transform: translateX(0); opacity: .08; } 50% { transform: translateX(930px); opacity: .26; } }
      @keyframes swap { 0%,32.9% { opacity: 1; } 33%,100% { opacity: 0; } }
    </style>
  </defs>

  <rect width="1200" height="150" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="150" rx="16" fill="url(#grid)" opacity="0.7"/>
  <rect x="30" y="24" width="1140" height="102" rx="14" fill="#07131f" stroke="#24445f"/>
  <rect x="54" y="42" width="1092" height="2" fill="url(#signal)" opacity="0.45"/>
  <rect x="54" y="42" width="128" height="2" fill="#ffffff" class="scan"/>

  <g class="font">
    <text x="58" y="72" font-size="18" font-weight="800" fill="#f0f6fc">SOC Telemetry Stream</text>
    <text x="58" y="94" font-size="12" fill="#8ba3bd">SIEM | Endpoint | Identity | Network | Cloud | Automation</text>
  </g>

  <path d="M350 86H1088" fill="none" stroke="#24445f" stroke-width="8" stroke-linecap="round"/>
  <path d="M350 86H1088" fill="none" stroke="url(#signal)" stroke-width="2.5" stroke-linecap="round" class="dash" filter="url(#glow)"/>

  <g class="font" text-anchor="middle">
    <g transform="translate(380 86)">
      <circle r="22" fill="#0d2233" stroke="#58a6ff"/>
      <circle r="5" fill="#58a6ff" class="pulse" filter="url(#glow)"/>
      <text y="40" font-size="10" fill="#8ba3bd">SIEM</text>
    </g>
    <g transform="translate(520 86)">
      <circle r="22" fill="#0d2233" stroke="#7ee787"/>
      <circle r="5" fill="#7ee787" class="pulse2" filter="url(#glow)"/>
      <text y="40" font-size="10" fill="#8ba3bd">EDR</text>
    </g>
    <g transform="translate(660 86)">
      <circle r="22" fill="#0d2233" stroke="#ffcf5a"/>
      <circle r="5" fill="#ffcf5a" class="pulse" filter="url(#glow)"/>
      <text y="40" font-size="10" fill="#8ba3bd">IAM</text>
    </g>
    <g transform="translate(800 86)">
      <circle r="22" fill="#0d2233" stroke="#58a6ff"/>
      <circle r="5" fill="#58a6ff" class="pulse2" filter="url(#glow)"/>
      <text y="40" font-size="10" fill="#8ba3bd">NET</text>
    </g>
    <g transform="translate(940 86)">
      <circle r="22" fill="#0d2233" stroke="#7ee787"/>
      <circle r="5" fill="#7ee787" class="pulse" filter="url(#glow)"/>
      <text y="40" font-size="10" fill="#8ba3bd">CLOUD</text>
    </g>
    <g transform="translate(1080 86)">
      <circle r="22" fill="#0d2233" stroke="#ff6b6b"/>
      <circle r="5" fill="#ff6b6b" class="pulse2" filter="url(#glow)"/>
      <text y="40" font-size="10" fill="#8ba3bd">SOAR</text>
    </g>
  </g>

  <g filter="url(#glow)">
    <circle r="4" fill="#58a6ff">
      <animateMotion dur="4.6s" repeatCount="indefinite" path="M350 86H1088"/>
    </circle>
    <circle r="4" fill="#7ee787">
      <animateMotion dur="4.6s" begin="1.2s" repeatCount="indefinite" path="M350 86H1088"/>
    </circle>
    <circle r="4" fill="#ffcf5a">
      <animateMotion dur="4.6s" begin="2.4s" repeatCount="indefinite" path="M350 86H1088"/>
    </circle>
  </g>

  <g class="mono" font-size="12">
    <rect x="58" y="105" width="266" height="18" rx="9" fill="#050f1a" stroke="#213c54"/>
    <text x="72" y="118" fill="#7ee787" class="line1">rule.deploy: sigma/windows/process</text>
    <text x="72" y="118" fill="#58a6ff" class="line2">hunt.query: suspicious_parent_child</text>
    <text x="72" y="118" fill="#ffcf5a" class="line3">playbook.run: enrich_and_score</text>
  </g>
</svg>
