    <!-- SOAR -->
    <g transform="translate(950 0)">
      <rect width="186" height="78" rx="8" class="card"/>
      <text x="14" y="16" class="lbl">SOAR · PLAYBOOKS</text>
      <circle cx="172" cy="14" r="3.5" fill="#f85149" class="pls6 blink" filter="url(#g)"/>
