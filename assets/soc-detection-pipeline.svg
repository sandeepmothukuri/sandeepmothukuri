<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Detection Engineering Pipeline</title>
  <desc id="desc">Animated end-to-end SOC detection pipeline: telemetry to response.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07101d"/>
      <stop offset="0.48" stop-color="#0b1728"/>
      <stop offset="1" stop-color="#06151a"/>
    </linearGradient>
    <linearGradient id="panel2" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#101c2f" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#071420" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" x2="1">
      <stop offset="0" stop-color="#36d1dc"/>
      <stop offset="0.5" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#7ee787"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" x2="1">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#7ee787" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f3b55" stroke-width="1" opacity="0.24"/>
    </pattern>
    <filter id="softGlow2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .f { font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
      .m { font-family: SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace; }
      .sm { font-size: 12px; fill: #8ba3bd; }
      .ttl { font-size: 13px; font-weight: 700; fill: #f0f6fc; }
      .panel2 { fill: url(#panel2); stroke: #274968; stroke-width: 1.2; }
      .node { fill: #0d2233; stroke: #1f6feb; stroke-width: 1.5; }
      .pulse-a { animation: pulse-a 2.4s ease-in-out infinite; }
      .pulse-b { animation: pulse-a 2.4s ease-in-out infinite 0.4s; }
      .pulse-c { animation: pulse-a 2.4s ease-in-out infinite 0.8s; }
      .pulse-d { animation: pulse-a 2.4s ease-in-out infinite 1.2s; }
      .pulse-e { animation: pulse-a 2.4s ease-in-out infinite 1.6s; }
      .dash2 { stroke-dasharray: 6 8; animation: dash2 3s linear infinite; }
      .flow1 { animation: travel 4s ease-in-out infinite; }
      .flow2 { animation: travel 4s ease-in-out infinite 0.8s; }
      .flow3 { animation: travel 4s ease-in-out infinite 1.6s; }
      .blink2 { animation: blink2 1.6s steps(2, start) infinite; }
      @keyframes pulse-a { 0%,100% { opacity: .45; } 50% { opacity: 1; transform: scale(1.15); } }
      @keyframes dash2 { to { stroke-dashoffset: -140; } }
      @keyframes travel { 0% { transform: translateX(0); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateX(180px); opacity: 0; } }
      @keyframes blink2 { 0%,49% { opacity: 1; } 50%,100% { opacity: .25; } }
    </style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg2)"/>
  <rect width="1200" height="420" fill="url(#grid2)" opacity="0.6"/>

  <!-- HEADER STRIP -->
  <g class="f">
    <rect x="36" y="24" width="1128" height="56" rx="12" class="panel2"/>
    <circle cx="62" cy="52" r="6" fill="#7ee787" class="pulse-a" filter="url(#softGlow2)"/>
    <text x="80" y="48" font-size="16" font-weight="800" fill="#f0f6fc">Detection Engineering Pipeline</text>
    <text x="80" y="68" class="sm">Telemetry → Sigma rule → SIEM match → Analyst triage → Containment · live</text>
    <g transform="translate(960 36)">
      <rect width="180" height="32" rx="10" fill="#071928" stroke="#1f6feb"/>
      <circle cx="16" cy="16" r="4" fill="#7ee787" class="blink2"/>
      <text x="30" y="20" class="m" font-size="11" fill="#7ee787">STATUS: PIPELINE ACTIVE</text>
    </g>
  </g>

  <!-- 5 STAGES -->
  <g class="f" transform="translate(54 110)">
    <!-- Stage 1: Telemetry -->
    <g transform="translate(0 0)">
      <rect width="200" height="160" rx="14" class="panel2"/>
      <circle cx="22" cy="24" r="6" fill="#36d1dc" class="pulse-a" filter="url(#softGlow2)"/>
      <text x="38" y="29" class="ttl">1 · TELEMETRY</text>
      <text x="22" y="52" class="sm">Raw signals ingested</text>
      <g transform="translate(22 64)">
        <text class="m" font-size="11" fill="#7ee787" y="0">▸ Sysmon EID 1, 3, 11</text>
        <text class="m" font-size="11" fill="#7ee787" y="18">▸ Zeek conn, dns, http</text>
        <text class="m" font-size="11" fill="#7ee787" y="36">▸ Windows Sec 4624, 4688</text>
        <text class="m" font-size="11" fill="#58a6ff" y="54">▸ EDR + Cloud Audit</text>
      </g>
      <rect x="22" y="138" width="156" height="6" rx="3" fill="#0d2233" stroke="#1f3b55"/>
      <rect x="22" y="138" width="118" height="6" rx="3" fill="#36d1dc" opacity="0.85"/>
    </g>

    <!-- Connector 1 -->
    <g transform="translate(200 70)">
      <line x1="0" y1="10" x2="68" y2="10" stroke="#1f6feb" stroke-width="1" opacity="0.45" class="dash2"/>
      <circle r="4" fill="#58a6ff" class="flow1" filter="url(#softGlow2)" cx="0" cy="10"/>
    </g>

    <!-- Stage 2: Sigma Rule -->
    <g transform="translate(228 0)">
      <rect width="200" height="160" rx="14" class="panel2"/>
      <circle cx="22" cy="24" r="6" fill="#58a6ff" class="pulse-b" filter="url(#softGlow2)"/>
      <text x="38" y="29" class="ttl">2 · DETECTION RULE</text>
      <text x="22" y="52" class="sm">Sigma → SPL / KQL / AQL</text>
      <rect x="14" y="62" width="172" height="78" rx="6" fill="#06131f" stroke="#24445f"/>
      <text class="m" font-size="9" fill="#7ee787" x="22" y="76">title: Encoded PowerShell</text>
      <text class="m" font-size="9" fill="#58a6ff" x="22" y="89">logsource: sysmon</text>
      <text class="m" font-size="9" fill="#ffcf5a" x="22" y="102">detection:</text>
      <text class="m" font-size="9" fill="#c9d1d9" x="32" y="115">CommandLine|contains: -enc</text>
      <text class="m" font-size="9" fill="#ff6b6b" x="22" y="128">level: high</text>
      <text class="m" font-size="9" fill="#c9d1d9" x="22" y="138">tags: T1059.001</text>
    </g>

    <!-- Connector 2 -->
    <g transform="translate(428 70)">
      <line x1="0" y1="10" x2="68" y2="10" stroke="#1f6feb" stroke-width="1" opacity="0.45" class="dash2"/>
      <circle r="4" fill="#58a6ff" class="flow2" filter="url(#softGlow2)" cx="0" cy="10"/>
    </g>

    <!-- Stage 3: SIEM Match -->
    <g transform="translate(456 0)">
      <rect width="200" height="160" rx="14" class="panel2"/>
      <circle cx="22" cy="24" r="6" fill="#ffcf5a" class="pulse-c" filter="url(#softGlow2)"/>
      <text x="38" y="29" class="ttl">3 · SIEM MATCH</text>
      <text x="22" y="52" class="sm">Alert fires · enriched</text>
      <g transform="translate(22 64)">
        <rect x="0" y="0" width="156" height="22" rx="5" fill="#1a0d12" stroke="#ff6b6b"/>
        <text class="m" font-size="10" fill="#ff6b6b" x="8" y="15">⚠ HIGH · powershell.exe</text>
      </g>
      <text class="m" font-size="10" fill="#c9d1d9" x="22" y="103">host: WS-FIN-014</text>
      <text class="m" font-size="10" fill="#c9d1d9" x="22" y="118">user: j.alvarez@corp</text>
      <text class="m" font-size="10" fill="#7ee787" x="22" y="134">geo: GB · risk: 84/100</text>
    </g>

    <!-- Connector 3 -->
    <g transform="translate(656 70)">
      <line x1="0" y1="10" x2="68" y2="10" stroke="#1f6feb" stroke-width="1" opacity="0.45" class="dash2"/>
      <circle r="4" fill="#58a6ff" class="flow3" filter="url(#softGlow2)" cx="0" cy="10"/>
    </g>

    <!-- Stage 4: Triage -->
    <g transform="translate(684 0)">
      <rect width="200" height="160" rx="14" class="panel2"/>
      <circle cx="22" cy="24" r="6" fill="#7ee787" class="pulse-d" filter="url(#softGlow2)"/>
      <text x="38" y="29" class="ttl">4 · ANALYST TRIAGE</text>
      <text x="22" y="52" class="sm">L3 review · TTP mapped</text>
      <g transform="translate(22 64)">
        <text class="m" font-size="10" fill="#58a6ff" y="0">$ hunt --ttp T1059.001</text>
        <text class="m" font-size="10" fill="#7ee787" y="18">[ok] sandbox: malicious</text>
        <text class="m" font-size="10" fill="#ffcf5a" y="36">[ok] IoC: 4 hits in 90d</text>
        <text class="m" font-size="10" fill="#ff6b6b" y="54">[!] verdict: TRUE POSITIVE</text>
      </g>
      <text class="m" font-size="9" fill="#8ba3bd" x="22" y="146">SLA: 12m / 30m target</text>
    </g>

    <!-- Connector 4 -->
    <g transform="translate(884 70)">
      <line x1="0" y1="10" x2="68" y2="10" stroke="#1f6feb" stroke-width="1" opacity="0.45" class="dash2"/>
      <circle r="4" fill="#58a6ff" class="flow1" filter="url(#softGlow2)" cx="0" cy="10"/>
    </g>

    <!-- Stage 5: Response -->
    <g transform="translate(912 0)">
      <rect width="180" height="160" rx="14" class="panel2"/>
      <circle cx="22" cy="24" r="6" fill="#ff6b6b" class="pulse-e" filter="url(#softGlow2)"/>
      <text x="38" y="29" class="ttl">5 · CONTAINMENT</text>
      <text x="22" y="52" class="sm">Auto-response · RCA</text>
      <g transform="translate(22 66)">
        <rect x="0" y="0" width="14" height="14" rx="3" fill="#7ee787" opacity="0.85"/>
        <text class="m" font-size="10" fill="#c9d1d9" x="20" y="11">isolate endpoint</text>
        <rect x="0" y="20" width="14" height="14" rx="3" fill="#7ee787" opacity="0.85"/>
        <text class="m" font-size="10" fill="#c9d1d9" x="20" y="31">disable user token</text>
        <rect x="0" y="40" width="14" height="14" rx="3" fill="#7ee787" opacity="0.85"/>
        <text class="m" font-size="10" fill="#c9d1d9" x="20" y="51">collect memory + disk</text>
        <rect x="0" y="60" width="14" height="14" rx="3" fill="#ffcf5a" opacity="0.85" class="blink2"/>
        <text class="m" font-size="10" fill="#c9d1d9" x="20" y="71">RCA + lessons-learned</text>
      </g>
    </g>
  </g>

  <!-- BOTTOM METRICS STRIP -->
  <g class="f" transform="translate(54 296)">
    <rect width="1092" height="86" rx="14" class="panel2"/>
    <text x="22" y="30" class="ttl">PIPELINE METRICS · last 90 days</text>

    <g transform="translate(22 46)">
      <text class="sm" y="0">MTTD (mean time to detect)</text>
      <text class="m" font-size="20" font-weight="800" fill="#7ee787" y="28">04:12</text>
    </g>
    <g transform="translate(232 46)">
      <text class="sm" y="0">MTTR (mean time to respond)</text>
      <text class="m" font-size="20" font-weight="800" fill="#58a6ff" y="28">11:47</text>
    </g>
    <g transform="translate(442 46)">
      <text class="sm" y="0">False-positive rate</text>
      <text class="m" font-size="20" font-weight="800" fill="#ffcf5a" y="28">7.4%</text>
    </g>
    <g transform="translate(622 46)">
      <text class="sm" y="0">Detections shipped</text>
      <text class="m" font-size="20" font-weight="800" fill="#36d1dc" y="28">45+</text>
    </g>
    <g transform="translate(792 46)">
      <text class="sm" y="0">MITRE coverage</text>
      <text class="m" font-size="20" font-weight="800" fill="#7ee787" y="28">86 TTPs</text>
    </g>
    <g transform="translate(952 46)">
      <text class="sm" y="0">SLA met</text>
      <text class="m" font-size="20" font-weight="800" fill="#7ee787" y="28">98.2%</text>
    </g>
  </g>

  <!-- BOTTOM HINT -->
  <g class="f" transform="translate(54 396)">
    <text class="sm" fill="#8ba3bd">Pipeline auto-instruments every detection — code-reviewed, version-controlled, CI-validated. Detection-as-code, not screenshots.</text>
  </g>
</svg>
