<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="40" viewBox="0 0 1200 40" role="img">
  <title>GitHub contribution feed live banner</title>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#040810"/>
      <stop offset="0.5" stop-color="#0a1929"/>
      <stop offset="1" stop-color="#040810"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#58a6ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="g"><feGaussianBlur stdDeviation="2.5"/></filter>
    <style>
      .f { font-family: SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace; }
      .live { animation: live 1.6s steps(2) infinite; }
      .pls  { animation: pls 3.2s ease-in-out infinite; }
      .pls2 { animation: pls 3.2s ease-in-out infinite 0.8s; }
      .scan { animation: scan 10s linear infinite; }
      .dash { stroke-dasharray: 3 8; animation: dash 16s linear infinite; }
      @keyframes live { 0%,49% { opacity: 1 } 50%,100% { opacity: 0.25 } }
      @keyframes pls  { 0%,100% { opacity: 0.4 } 50% { opacity: 1 } }
      @keyframes scan { 0% { transform: translateX(-200px) } 100% { transform: translateX(1200px) } }
      @keyframes dash { to { stroke-dashoffset: -260 } }
    </style>
  </defs>

  <rect width="1200" height="40" fill="url(#bg)"/>
  <line x1="0" y1="2"  x2="1200" y2="2"  stroke="#1f6feb" stroke-width="1" opacity="0.6"/>
  <line x1="0" y1="38" x2="1200" y2="38" stroke="#1f6feb" stroke-width="1" opacity="0.3"/>

  <!-- Center scan beam -->
  <rect class="scan" x="-200" y="0" width="200" height="40" fill="url(#beam)"/>

  <!-- Animated dashed line through middle -->
  <line x1="0" y1="20" x2="1200" y2="20" stroke="#1f6feb" stroke-width="0.7" stroke-dasharray="3 8" class="dash" opacity="0.3"/>

  <!-- LEFT: LIVE indicator -->
  <g class="f">
    <circle cx="34" cy="20" r="5" fill="#3fb950" class="live" filter="url(#g)"/>
    <circle cx="34" cy="20" r="4" fill="#3fb950"/>
    <text x="48"  y="24" font-size="11" font-weight="700" fill="#3fb950" letter-spacing="1.6">LIVE</text>
    <text x="86"  y="24" font-size="11" fill="#8ba3bd" letter-spacing="0.8">·</text>
    <text x="98"  y="24" font-size="11" font-weight="700" fill="#f0f6fc" letter-spacing="0.8">GITHUB CONTRIBUTION FEED</text>
    <text x="282" y="24" font-size="11" fill="#8ba3bd" letter-spacing="0.4">·  snake auto-eats commits daily</text>
  </g>

  <!-- RIGHT: status pills -->
  <g class="f">
    <text x="850" y="24" font-size="10" fill="#8ba3bd">▸</text>
    <text x="864" y="24" font-size="10" fill="#8ba3bd">refreshes 05:00 UTC</text>
    <text x="996" y="24" font-size="10" fill="#8ba3bd">·</text>
    <text x="1008" y="24" font-size="10" font-weight="700" fill="#58a6ff" letter-spacing="0.8">STATUS:</text>
    <text x="1062" y="24" font-size="10" font-weight="700" fill="#3fb950">ONLINE</text>
    <circle cx="1118" cy="20" r="3" fill="#58a6ff" class="pls" filter="url(#g)"/>
    <circle cx="1132" cy="20" r="3" fill="#58a6ff" class="pls2" filter="url(#g)"/>
    <circle cx="1146" cy="20" r="3" fill="#58a6ff" class="pls" filter="url(#g)"/>
  </g>
</svg>
