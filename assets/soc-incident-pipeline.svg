<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-labelledby="t d">
  <title id="t">SOC Tool Ecosystem — Data Flow</title>
  <desc id="d">Animated diagram showing how SOC tools connect across collection, analysis, enrichment, and response stages.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#070d1a"/>
      <stop offset="0.5" stop-color="#0a1929"/>
      <stop offset="1" stop-color="#040810"/>
    </linearGradient>
    <linearGradient id="pnl" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#132f4c" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0a1929" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#1a3a5f"/>
      <stop offset="1" stop-color="#0d2233"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" x2="1">
      <stop offset="0" stop-color="#1f6feb" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#1f6feb" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#1f3b55" stroke-width="1" opacity="0.22"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .f { font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
      .m { font-family: SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace; }
      .ttl { font-size: 16px; font-weight: 800; fill: #f0f6fc; letter-spacing: 0.4px; }
      .lbl { font-size: 10px; fill: #58a6ff; letter-spacing: 1.6px; font-weight: 700; }
      .sm { font-size: 10px; fill: #8ba3bd; letter-spacing: 0.3px; }
      .toolname { font-size: 11px; font-weight: 700; fill: #f0f6fc; }
      .toolsub { font-size: 9px; fill: #8ba3bd; }
      .pnl { fill: url(#pnl); stroke: #1f3b55; stroke-width: 1; }
      .card { fill: url(#card); stroke: #1f6feb; stroke-width: 1; }
      .pulse-a { animation: pls 2.4s ease-in-out infinite; }
      .pulse-b { animation: pls 2.4s ease-in-out infinite 0.4s; }
      .pulse-c { animation: pls 2.4s ease-in-out infinite 0.8s; }
      .pulse-d { animation: pls 2.4s ease-in-out infinite 1.2s; }
      .live { animation: live 1.4s steps(2) infinite; }
      @keyframes pls { 0%,100% { opacity: 0.4; transform: scale(1) } 50% { opacity: 1; transform: scale(1.2) } }
      @keyframes live { 0%,49% { opacity: 1 } 50%,100% { opacity: 0.3 } }
    </style>
  </defs>

  <rect width="1200" height="230" fill="url(#bg)"/>
  <rect width="1200" height="230" fill="url(#grid)" opacity="0.55"/>

  <!-- Outer panel -->
  <rect x="24" y="16" width="1152" height="198" rx="14" class="pnl"/>

  <!-- Header -->
  <g class="f">
    <text x="44" y="44" class="ttl">SOC TOOL ECOSYSTEM · DATA FLOW</text>
    <text x="44" y="60" class="sm">Telemetry → SIEM → Enrichment → Response · live integration architecture</text>

    <g transform="translate(986 28)">
      <rect width="170" height="32" rx="8" fill="#0d2233" stroke="#1f6feb"/>
      <circle cx="16" cy="16" r="5" fill="#3fb950" class="live" filter="url(#glow)"/>
      <text x="30" y="14" class="sm" fill="#8ba3bd" letter-spacing="1.4">PIPELINE</text>
      <text x="30" y="26" class="m" font-size="10" fill="#3fb950">11 tools · ALL ONLINE</text>
    </g>
  </g>

  <!-- Stage labels -->
  <g class="f" text-anchor="middle">
    <text x="124" y="86" class="lbl">COLLECT</text>
    <text x="374" y="86" class="lbl">ANALYZE</text>
    <text x="624" y="86" class="lbl">ENRICH</text>
    <text x="874" y="86" class="lbl">RESPOND</text>
    <text x="1100" y="86" class="lbl">REPORT</text>
  </g>

  <!-- Flow connector lines (between stages) -->
  <g fill="none" stroke="url(#flow)" stroke-width="1.5">
    <line x1="180" y1="148" x2="320" y2="148"/>
    <line x1="430" y1="148" x2="570" y2="148"/>
    <line x1="680" y1="148" x2="820" y2="148"/>
    <line x1="930" y1="148" x2="1060" y2="148"/>
  </g>

  <!-- Animated traveling dots along flow lines -->
  <g filter="url(#glow)">
    <circle r="4" fill="#58a6ff">
      <animateMotion dur="3.5s" repeatCount="indefinite" path="M180 148 L320 148"/>
    </circle>
    <circle r="3" fill="#3fb950">
      <animateMotion dur="3.5s" begin="0.7s" repeatCount="indefinite" path="M180 148 L320 148"/>
    </circle>
    <circle r="4" fill="#58a6ff">
      <animateMotion dur="3.5s" begin="0.4s" repeatCount="indefinite" path="M430 148 L570 148"/>
    </circle>
    <circle r="4" fill="#58a6ff">
      <animateMotion dur="3.5s" begin="1s" repeatCount="indefinite" path="M680 148 L820 148"/>
    </circle>
    <circle r="3" fill="#ffcf5a">
      <animateMotion dur="3.5s" begin="1.6s" repeatCount="indefinite" path="M680 148 L820 148"/>
    </circle>
    <circle r="4" fill="#58a6ff">
      <animateMotion dur="3.5s" begin="1.2s" repeatCount="indefinite" path="M930 148 L1060 148"/>
    </circle>
  </g>

  <!-- COLLECT stage: 3 tool cards stacked -->
  <g class="f" transform="translate(60 100)">
    <g transform="translate(0 0)">
      <rect width="120" height="30" rx="6" class="card"/>
      <circle cx="14" cy="15" r="4" fill="#3fb950" class="pulse-a" filter="url(#glow)"/>
      <text x="26" y="14" class="toolname">Sysmon</text>
      <text x="26" y="25" class="toolsub">Win EID 1·3·11</text>
    </g>
    <g transform="translate(0 35)">
      <rect width="120" height="30" rx="6" class="card"/>
      <circle cx="14" cy="15" r="4" fill="#3fb950" class="pulse-b" filter="url(#glow)"/>
      <text x="26" y="14" class="toolname">Zeek</text>
      <text x="26" y="25" class="toolsub">conn·dns·http</text>
    </g>
    <g transform="translate(0 70)">
      <rect width="120" height="30" rx="6" class="card"/>
      <circle cx="14" cy="15" r="4" fill="#3fb950" class="pulse-c" filter="url(#glow)"/>
      <text x="26" y="14" class="toolname">EDR · Falcon</text>
      <text x="26" y="25" class="toolsub">endpoint stream</text>
    </g>
  </g>

  <!-- ANALYZE stage: 3 tool cards -->
  <g class="f" transform="translate(310 100)">
    <g transform="translate(0 0)">
      <rect width="120" height="30" rx="6" class="card"/>
      <circle cx="14" cy="15" r="4" fill="#58a6ff" class="pulse-b" filter="url(#glow)"/>
      <text x="26" y="14" class="toolname">Splunk</text>
      <text x="26" y="25" class="toolsub">SPL · 240 rules</text>
    </g>
    <g transform="translate(0 35)">
      <rect width="120" height="30" rx="6" class="card"/>
      <circle cx="14" cy="15" r="4" fill="#58a6ff" class="pulse-c" filter="url(#glow)"/>
      <text x="26" y="14" class="toolname">Wazuh</text>
      <text x="26" y="25" class="toolsub">XDR · 86 TTPs</text>
    </g>
    <g transform="translate(0 70)">
      <rect width="120" height="30" rx="6" class="card"/>
      <circle cx="14" cy="15" r="4" fill="#58a6ff" class="pulse-a" filter="url(#glow)"/>
      <text x="26" y="14" class="toolname">Sentinel</text>
      <text x="26" y="25" class="toolsub">KQL · cloud</text>
    </g>
  </g>

  <!-- ENRICH stage: 2 tool cards -->
  <g class="f" transform="translate(560 100)">
    <g transform="translate(0 0)">
      <rect width="120" height="30" rx="6" class="card"/>
      <circle cx="14" cy="15" r="4" fill="#ffcf5a" class="pulse-c" filter="url(#glow)"/>
      <text x="26" y="14" class="toolname">MISP</text>
      <text x="26" y="25" class="toolsub">IoC · TI feeds</text>
    </g>
    <g transform="translate(0 35)">
      <rect width="120" height="30" rx="6" class="card"/>
      <circle cx="14" cy="15" r="4" fill="#ffcf5a" class="pulse-a" filter="url(#glow)"/>
      <text x="26" y="14" class="toolname">VirusTotal</text>
      <text x="26" y="25" class="toolsub">hash · domain</text>
    </g>
    <g transform="translate(0 70)">
      <rect width="120" height="30" rx="6" class="card"/>
      <circle cx="14" cy="15" r="4" fill="#ffcf5a" class="pulse-b" filter="url(#glow)"/>
      <text x="26" y="14" class="toolname">Any.Run</text>
      <text x="26" y="25" class="toolsub">sandbox detonate</text>
    </g>
  </g>

  <!-- RESPOND stage: 3 tool cards -->
  <g class="f" transform="translate(810 100)">
    <g transform="translate(0 0)">
      <rect width="120" height="30" rx="6" class="card"/>
      <circle cx="14" cy="15" r="4" fill="#f85149" class="pulse-a" filter="url(#glow)"/>
      <text x="26" y="14" class="toolname">TheHive</text>
      <text x="26" y="25" class="toolsub">case mgmt</text>
    </g>
    <g transform="translate(0 35)">
      <rect width="120" height="30" rx="6" class="card"/>
      <circle cx="14" cy="15" r="4" fill="#f85149" class="pulse-b" filter="url(#glow)"/>
      <text x="26" y="14" class="toolname">Shuffle SOAR</text>
      <text x="26" y="25" class="toolsub">12 playbooks</text>
    </g>
    <g transform="translate(0 70)">
      <rect width="120" height="30" rx="6" class="card"/>
      <circle cx="14" cy="15" r="4" fill="#f85149" class="pulse-c" filter="url(#glow)"/>
      <text x="26" y="14" class="toolname">Ollama LLaMA3</text>
      <text x="26" y="25" class="toolsub">AI triage assist</text>
    </g>
  </g>

  <!-- REPORT stage: 2 stacked output cards -->
  <g class="f" transform="translate(1060 100)">
    <g transform="translate(0 0)">
      <rect width="100" height="30" rx="6" class="card"/>
      <circle cx="14" cy="15" r="4" fill="#3fb950" class="pulse-d" filter="url(#glow)"/>
      <text x="26" y="14" class="toolname">RCA · MD</text>
      <text x="26" y="25" class="toolsub">post-mortem</text>
    </g>
    <g transform="translate(0 35)">
      <rect width="100" height="30" rx="6" class="card"/>
      <circle cx="14" cy="15" r="4" fill="#3fb950" class="pulse-a" filter="url(#glow)"/>
      <text x="26" y="14" class="toolname">Grafana</text>
      <text x="26" y="25" class="toolsub">exec dashbd</text>
    </g>
    <g transform="translate(0 70)">
      <rect width="100" height="30" rx="6" class="card"/>
      <circle cx="14" cy="15" r="4" fill="#3fb950" class="pulse-b" filter="url(#glow)"/>
      <text x="26" y="14" class="toolname">Slack · Teams</text>
      <text x="26" y="25" class="toolsub">stakeholder alerts</text>
    </g>
  </g>

  <!-- Bottom architecture note -->
  <g class="f" transform="translate(44 204)">
    <text class="sm" fill="#8ba3bd" y="0">ARCHITECTURE ·</text>
    <text class="sm" fill="#58a6ff" font-weight="700" y="0" x="86">Open-source first</text>
    <text class="sm" fill="#8ba3bd" y="0" x="186">·  AI-augmented triage  ·</text>
    <text class="sm" fill="#58a6ff" font-weight="700" y="0" x="338">Detection-as-code</text>
    <text class="sm" fill="#8ba3bd" y="0" x="442">·  CI-validated rules  ·</text>
    <text class="sm" fill="#58a6ff" font-weight="700" y="0" x="582">MITRE-mapped</text>
    <text class="sm" fill="#8ba3bd" y="0" x="664">·  SLA-tracked  ·</text>
    <text class="sm" fill="#3fb950" font-weight="700" y="0" x="760">healthy</text>
    <text class="m" font-size="10" fill="#8ba3bd" y="0" x="820">·  uptime 99.94%  ·  ingest 2.4M events/day  ·  alerts 247/24h</text>
  </g>
</svg>
