<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="36" viewBox="0 0 1200 36" role="img">
  <title>GitHub contribution feed footer banner</title>
  <defs>
    <linearGradient id="bg2" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#040810"/>
      <stop offset="0.5" stop-color="#0a1929"/>
      <stop offset="1" stop-color="#040810"/>
    </linearGradient>
    <filter id="g2"><feGaussianBlur stdDeviation="2.5"/></filter>
    <style>
      .f { font-family: SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace; }
      .pls   { animation: pls 3.2s ease-in-out infinite; }
      .pls-b { animation: pls 3.2s ease-in-out infinite 0.5s; }
      .pls-c { animation: pls 3.2s ease-in-out infinite 1.0s; }
      .pls-d { animation: pls 3.2s ease-in-out infinite 1.5s; }
      .pls-e { animation: pls 3.2s ease-in-out infinite 2.0s; }
      .dash  { stroke-dasharray: 4 9; animation: dash 14s linear infinite; }
      .blink { animation: blink 1.4s steps(2) infinite; }
      @keyframes pls  { 0%,100% { opacity: 0.35 } 50% { opacity: 1 } }
      @keyframes dash { to { stroke-dashoffset: -260 } }
      @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0.2 } }
    </style>
  </defs>

  <rect width="1200" height="36" fill="url(#bg2)"/>
  <line x1="0" y1="2"  x2="1200" y2="2"  stroke="#1f6feb" stroke-width="1" opacity="0.3"/>
  <line x1="0" y1="34" x2="1200" y2="34" stroke="#1f6feb" stroke-width="1" opacity="0.6"/>

  <!-- Animated dashed flow line through middle -->
  <line x1="0" y1="18" x2="1200" y2="18" stroke="#58a6ff" stroke-width="0.9" stroke-dasharray="4 9" class="dash" opacity="0.55"/>

  <!-- LEFT: stats -->
  <g class="f">
    <text x="32" y="22" font-size="10" fill="#8ba3bd" letter-spacing="1.4">▸ STATS</text>
    <text x="86" y="22" font-size="10" fill="#8ba3bd">·</text>
    <text x="96" y="22" font-size="10" fill="#f0f6fc">contributions consumed:</text>
    <text x="232" y="22" font-size="11" font-weight="800" fill="#3fb950">247</text>
    <text x="260" y="22" font-size="10" fill="#8ba3bd">·  cells lit:</text>
    <text x="328" y="22" font-size="11" font-weight="800" fill="#58a6ff">198</text>
    <text x="356" y="22" font-size="10" fill="#8ba3bd">·  longest streak:</text>
    <text x="450" y="22" font-size="11" font-weight="800" fill="#ffcf5a">12d</text>
  </g>

  <!-- CENTER: capability tags with pulsing dots (8 items) -->
  <g class="f" transform="translate(540 0)">
    <circle cx="6" cy="18" r="2.5" fill="#3fb950" class="pls" filter="url(#g2)"/>
    <text x="16" y="22" font-size="10" fill="#c9d1d9">IR</text>
    <circle cx="48" cy="18" r="2.5" fill="#58a6ff" class="pls-b" filter="url(#g2)"/>
    <text x="58" y="22" font-size="10" fill="#c9d1d9">HUNT</text>
    <circle cx="106" cy="18" r="2.5" fill="#58a6ff" class="pls-c" filter="url(#g2)"/>
    <text x="116" y="22" font-size="10" fill="#c9d1d9">DET-ENG</text>
    <circle cx="188" cy="18" r="2.5" fill="#ffcf5a" class="pls-d" filter="url(#g2)"/>
    <text x="198" y="22" font-size="10" fill="#c9d1d9">SOAR</text>
    <circle cx="248" cy="18" r="2.5" fill="#58a6ff" class="pls-e" filter="url(#g2)"/>
    <text x="258" y="22" font-size="10" fill="#c9d1d9">CLOUD</text>
    <circle cx="310" cy="18" r="2.5" fill="#f85149" class="pls" filter="url(#g2)"/>
    <text x="320" y="22" font-size="10" fill="#c9d1d9">MITRE</text>
    <circle cx="372" cy="18" r="2.5" fill="#3fb950" class="pls-c" filter="url(#g2)"/>
    <text x="382" y="22" font-size="10" fill="#c9d1d9">LABS</text>
    <circle cx="430" cy="18" r="2.5" fill="#a371f7" class="pls-d" filter="url(#g2)"/>
    <text x="440" y="22" font-size="10" fill="#c9d1d9">AI-SOC</text>
  </g>

  <!-- RIGHT: signature -->
  <g class="f">
    <text x="1010" y="22" font-size="10" fill="#8ba3bd" letter-spacing="0.5">▸ Platane/snk</text>
    <text x="1098" y="22" font-size="10" fill="#8ba3bd">·</text>
    <text x="1108" y="22" font-size="10" fill="#58a6ff" font-weight="700">●</text>
    <text x="1120" y="22" font-size="10" fill="#3fb950" class="blink">REC</text>
  </g>
</svg>
