name: Generate Metrics

on:
  schedule:
    - cron: "0 7 * * *"   # daily at 07:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/metrics.yml

permissions:
  contents: write

jobs:
  lines:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.lines.svg
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          user: sandeepmothukuri
          base: ""
          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_lines_repositories_limit: 4
          plugin_lines_sections: base, repositories
          plugin_lines_skipped: sandeepmothukuri/sandeepmothukuri
          config_timezone: Europe/London

  languages:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.languages.svg
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          user: sandeepmothukuri
          base: ""
          plugin_languages: yes
          plugin_languages_ignored: html, css, makefile, dockerfile, hcl, tex, batchfile, scss, less, vue, svelte
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 6
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 15
          config_timezone: Europe/London

  isocalendar:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.isocalendar.svg
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          user: sandeepmothukuri
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: Europe/London

  achievements:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.achievements.svg
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          user: sandeepmothukuri
          base: ""
          plugin_achievements: yes
          plugin_achievements_threshold: B
          plugin_achievements_secrets: yes
          plugin_achievements_display: detailed
          plugin_achievements_limit: 0
          config_timezone: Europe/London
