name: Generate Metrics

on:
  schedule:
    - cron: "0 7 * * *"   # daily at 07:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/metrics.yml

permissions:
  contents: write

jobs:
  lines:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.lines.svg
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          user: sandeepmothukuri
          base: ""
          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_lines_repositories_limit: 4
          plugin_lines_sections: base, repositories
          plugin_lines_skipped: sandeepmothukuri/sandeepmothukuri
          config_timezone: Europe/London

  languages:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.languages.svg
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          user: sandeepmothukuri
          base: ""
          plugin_languages: yes
          plugin_languages_ignored: html, css, makefile, dockerfile, hcl, tex, batchfile, scss, less, vue, svelte
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 6
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 15
          config_timezone: Europe/London

  isocalendar:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.isocalendar.svg
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          user: sandeepmothukuri
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: Europe/London

  habits:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.habits.svg
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          user: sandeepmothukuri
          base: ""
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: classic
          plugin_habits_days: 14
          plugin_habits_skipped: sandeepmothukuri/sandeepmothukuri
          config_timezone: Europe/London

  followup:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.followup.svg
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          user: sandeepmothukuri
          base: ""
          plugin_followup: yes
          plugin_followup_sections: repositories
          plugin_followup_indepth: yes
          config_timezone: Europe/London

  topics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.topics.svg
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          user: sandeepmothukuri
          base: ""
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_sort: stars
          plugin_topics_limit: 15
          config_timezone: Europe/London

  introduction:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.introduction.svg
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          user: sandeepmothukuri
          base: ""
          plugin_introduction: yes
          plugin_introduction_title: yes
          config_timezone: Europe/London

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.website.svg
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          user: sandeepmothukuri
          base: ""
          plugin_screenshot: yes
          plugin_screenshot_title: 🌐 cybertechnology.in
          plugin_screenshot_url: https://cybertechnology.in
          plugin_screenshot_selector: body
          plugin_screenshot_viewport: '{ "width": 1280, "height": 800 }'
          plugin_screenshot_wait: 3000
          config_timezone: Europe/London
