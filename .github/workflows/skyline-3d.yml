name: Generate 3D Contribution Skyline

on:
  schedule:
    - cron: "30 5 * * *"   # daily at 05:30 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/skyline-3d.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: sandeepmothukuri

      - name: Commit generated SVGs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/*.svg
          if ! git diff --quiet --cached; then
            git commit -m "chore: regenerate 3D contribution skyline"
            git push
          else
            echo "No skyline changes."
          fi
