name: Profile Integrity Check

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - '.github/scripts/**'
      - '.github/workflows/profile-enhancements.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Profile Integrity
        run: python3 .github/scripts/apply-profile-enhancements.py
