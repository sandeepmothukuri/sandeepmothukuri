name: Restore Profile Visitor History

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore visible profile visitor history
        shell: python
        run: |
          import json, re
          from pathlib import Path
          readme = Path('README.md')
          hist = json.loads(Path('metrics/history.json').read_text(encoding='utf-8'))
          rows = hist.get('profile_views', [])
          if not rows:
              raise SystemExit('No profile visitor history found')
          latest = rows[-1]
          total = int(latest.get('total', 0))
          today = int(latest.get('daily', 0))
          last30 = sum(int(r.get('daily', 0) or 0) for r in rows[-30:])
          recent = rows[-30:]
          table = ['| Date | Daily views | Cumulative views |', '|---|---:|---:|']
          for r in reversed(recent):
              table.append(f"| {r['date']} | {int(r.get('daily', 0) or 0)} | {int(r.get('total', 0) or 0)} |")
          block = '''<!-- PROFILE-VISITOR-HISTORY START -->
## 👁️ Profile Visitor History

<p align="center">
  <img src="https://img.shields.io/badge/Overall%20views-%s-3fb950?style=flat-square&labelColor=132f4c" alt="Overall profile views: %s">
  <img src="https://img.shields.io/badge/Last%2030%20days-%s-36d1dc?style=flat-square&labelColor=132f4c" alt="Profile views in last 30 days: %s">
  <img src="https://img.shields.io/badge/Today-%s-ffcf5a?style=flat-square&labelColor=132f4c" alt="Profile views today: %s">
</p>

<details>
<summary><b>Last 30 days — daily visitor history</b></summary>

%s

</details>

<sub>Source: persisted daily profile-view history in <a href="https://github.com/sandeepmothukuri/sandeepmothukuri/blob/main/metrics/history.json">metrics/history.json</a>.</sub>
<!-- PROFILE-VISITOR-HISTORY END -->''' % (f'{total:,}', f'{total:,}', f'{last30:,}', f'{last30:,}', f'{today:,}', f'{today:,}', '\n'.join(table))
          text = readme.read_text(encoding='utf-8')
          pattern = re.compile(r'<!-- PROFILE-VISITOR-HISTORY START -->.*?<!-- PROFILE-VISITOR-HISTORY END -->', re.S)
          if pattern.search(text):
              text = pattern.sub(block, text, count=1)
          else:
              anchor = '<!-- TYPING ANIMATION -->'
              if anchor not in text:
                  raise SystemExit('README anchor not found')
              text = text.replace(anchor, block + '\n\n' + anchor, 1)
          readme.write_text(text, encoding='utf-8')

      - name: Commit restored history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m "restore profile visitor history"
          git push

      - name: Remove one-shot restore workflow
        if: success()
        run: |
          git rm -f .github/workflows/restore-profile-visitor-history.yml
          git commit -m "chore: remove one-shot visitor history restore"
          git push
