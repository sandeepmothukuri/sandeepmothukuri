name: Private Traffic Digest

# Writes a daily traffic report to the Actions run summary.
# Only repo admins can view workflow run pages — NOT public.
# View at: https://github.com/sandeepmothukuri/sandeepmothukuri/actions/workflows/traffic-digest.yml

on:
  schedule:
    - cron: "0 6 * * *"  # daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate digest into job summary
        env:
          # GH_PAT must have `public_repo` scope minimum (or `repo` for private repos).
          # Add via: Repo Settings → Secrets and variables → Actions → New repository secret.
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          bash .github/scripts/traffic-digest.sh
          # Pipe the produced digest.md into the run summary (private to admins)
          cat digest.md >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "_View the same data anytime at <https://github.com/sandeepmothukuri/sandeepmothukuri/actions/workflows/traffic-digest.yml>._" >> "$GITHUB_STEP_SUMMARY"
