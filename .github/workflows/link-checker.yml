name: Link Integrity Guardrail

on:
  schedule:
    - cron: "0 10 * * 1"   # Mondays at 10:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - '.github/scripts/verify-links.py'
      - '.github/workflows/link-checker.yml'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Zero-Broken-Links Verification
        run: python3 .github/scripts/verify-links.py
