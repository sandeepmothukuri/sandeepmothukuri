name: Fix PromptShield profile card

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-promptshield-profile.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair Featured Labs markup
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('README.md')
          s = p.read_text(encoding='utf-8')

          start = s.find('### 🛡️ [PromptSentinel]')
          end = s.find('### 🔥 [SOCForge]', start)
          if start == -1 or end == -1:
              raise SystemExit('Featured Labs anchors not found')

          replacement = '''### 🛡️ [PromptSentinel](https://github.com/sandeepmothukuri/PromptSentinel)
          Enterprise-grade prompt injection detection and AI firewall — 22 detectors, OWASP LLM Top 10, SARIF/SIEM output, FastAPI + Docker.
          <!-- REPO-METRICS:PromptSentinel START -->
          <sub><img src="https://img.shields.io/badge/%F0%9F%91%81%20views-live-3fb950?style=flat-square&labelColor=132f4c" alt="👁 views live"> <img src="https://img.shields.io/badge/%F0%9F%93%A5%20clones-live-36d1dc?style=flat-square&labelColor=132f4c" alt="📥 clones live"> <img src="https://img.shields.io/badge/%E2%AD%90%20stars-live-ffcf5a?style=flat-square&labelColor=132f4c" alt="⭐ stars live"> <img src="https://img.shields.io/badge/%F0%9F%8D%B4%20forks-live-a371f7?style=flat-square&labelColor=132f4c" alt="🍴 forks live"></sub>
          <!-- REPO-METRICS:PromptSentinel END -->

          </td>
          <td width="50%" valign="top">

          ### 🛡️ [PromptShield](https://github.com/sandeepmothukuri/PromptShield)
          Enterprise-grade prompt injection detection and AI firewall — 22 detectors, OWASP LLM Top 10, SARIF/SIEM output, FastAPI + Docker.
          <!-- REPO-METRICS:PromptShield START -->
          <sub><img src="https://img.shields.io/badge/%F0%9F%91%81%20views-live-3fb950?style=flat-square&labelColor=132f4c" alt="👁 views live"> <img src="https://img.shields.io/badge/%F0%9F%93%A5%20clones-live-36d1dc?style=flat-square&labelColor=132f4c" alt="📥 clones live"> <img src="https://img.shields.io/badge/%E2%AD%90%20stars-live-ffcf5a?style=flat-square&labelColor=132f4c" alt="⭐ stars live"> <img src="https://img.shields.io/badge/%F0%9F%8D%B4%20forks-live-a371f7?style=flat-square&labelColor=132f4c" alt="🍴 forks live"></sub>
          <!-- REPO-METRICS:PromptShield END -->

          </td>
          </tr>
          <tr>
          <td width="50%" valign="top">

          '''
          # Strip workflow indentation introduced by the triple-quoted string.
          replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in replacement.splitlines())
          s = s[:start] + replacement + s[end:]

          # Remove accidental duplicate PromptShield blocks outside table cells.
          s = re.sub(r'\n### 🛡️ \[PromptShield\]\(https://github\.com/sandeepmothukuri/PromptShield\).*?<!-- REPO-METRICS:PromptShield END -->\n\n</td>\n\n<tr>\n<td width="50%" valign="top">\n\n### 🔥 \[SOCForge\]', '\n### 🔥 [SOCForge]', s, flags=re.S, count=1)

          p.write_text(s, encoding='utf-8')

      - name: Commit profile fix and remove helper workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git rm .github/workflows/fix-promptshield-profile.yml
          git commit -m 'fix(profile): repair PromptShield Featured Labs card'
          git push
