name: Generate Snake Animation - Draft Growth

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: sandeepmothukuri
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Add contribution-driven snake growth
        run: python3 .github/scripts/snake-growth.py

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: draft-snake-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
