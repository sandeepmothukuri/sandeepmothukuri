name: Generate Snake Animation - Draft Growth

on:
  workflow_dispatch:
  push:
    branches:
      - draft/snake-growth-v2

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout draft
        uses: actions/checkout@v4

      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: sandeepmothukuri
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Add contribution-driven growth
        run: python3 .github/scripts/snake-growth.py

      - name: Publish draft output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: draft-snake-output-v2
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
