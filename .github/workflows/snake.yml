name: Generate Snake Animation

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: sandeepmothukuri
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Add normal-size growth segments after eaten contributions
        shell: python
        run: |
          from pathlib import Path
          import re

          DURATION_MS = 20900
          SEGMENT_DELAY_MS = 260
          MAX_SEGMENTS = 80

          for path in Path("dist").glob("github-snake*.svg"):
              svg = path.read_text(encoding="utf-8")

              # Find the actual snake group regardless of formatting or
              # whether the group has additional attributes.
              group_match = re.search(r'<g class="s"[^>]*>', svg)
              if not group_match:
                  raise SystemExit(f"Original snake group not found in {path}")

              # Each cN keyframe marks a contribution cell being eaten.
              events = [
                  float(x)
                  for x in re.findall(
                      r'@keyframes c[0-9a-z]+\{([0-9]+(?:\.[0-9]+)?)%\{fill:',
                      svg,
                  )
              ]
              events = sorted(set(events))[:MAX_SEGMENTS]

              if not events:
                  raise SystemExit(f"No contribution eating events found in {path}")

              css = [
                  "<style>",
                  ".growth-segment{shape-rendering:geometricPrecision;fill:var(--cs);opacity:0;}",
              ]
              body = ['<g aria-label="snake growth body">']

              for i, event in enumerate(events, 1):
                  # Keep every segment at the native 16x16 snake-grid size.
                  # It follows the original path one grid-step behind the head.
                  lag = i * SEGMENT_DELAY_MS
                  before = max(0.0, event - 0.03)

                  css.append(
                      f".growth-{i}" + "{"
                      f"animation-name:s0,grow{i};"
                      f"animation-duration:{DURATION_MS}ms,{DURATION_MS}ms;"
                      "animation-timing-function:linear,linear;"
                      "animation-iteration-count:infinite,infinite;"
                      f"animation-delay:-{lag}ms,0ms;"
                      "animation-fill-mode:both,both;"
                      "}"
                  )
                  css.append(
                      f"@keyframes grow{i}" + "{"
                      f"0%,{before:.2f}%{{opacity:0;}}"
                      f"{event:.2f}%,100%{{opacity:1;}}"
                      "}"
                  )

                  body.append(
                      f'<rect class="growth-segment growth-{i}" '
                      'x="0" y="-16" width="16" height="16" rx="3" ry="3" />'
                  )

              body.append("</g>")
              css.append("</style>")

              # Add the growth body immediately before Platane's original
              # snake group, leaving the original snake/head unchanged.
              insert_at = group_match.start()
              svg = svg[:insert_at] + "".join(css) + "".join(body) + svg[insert_at:]
              path.write_text(svg, encoding="utf-8")

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
