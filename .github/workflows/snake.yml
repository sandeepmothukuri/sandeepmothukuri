name: Generate Snake Animation

on:
  schedule:
    - cron: "0 5 * * *"  # daily at 05:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: sandeepmothukuri
          outputs: |
            dist/github-snake.svg?color_snake=#1f6feb&color_dots=#0a1929,#132f4c,#1f6feb,#58a6ff,#ffffff
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#58a6ff&color_dots=#0a1929,#132f4c,#1f6feb,#58a6ff,#ffffff

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
