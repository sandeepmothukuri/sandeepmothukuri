name: Generate Snake Animation

on:
  schedule:
    - cron: "0 5 * * *"  # daily at 05:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: sandeepmothukuri
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # Keep Platane's original 12px contribution cells and normal snake size.
      # After each contribution is eaten, add one normal-size body segment.
      - name: Add contribution-growth body segments
        shell: python
        run: |
          from pathlib import Path
          import re

          MAX_SEGMENTS = 60
          SEGMENT_DELAY_MS = 260
          DURATION_MS = 20900

          for path in Path("dist").glob("github-snake*.svg"):
              svg = path.read_text(encoding="utf-8")

              # Platane's contribution-cell animations contain the exact
              # timestamps at which the snake reaches/eats each cell.
              events = [
                  float(x)
                  for x in re.findall(r"@keyframes c\\w+\\{([0-9.]+)%\\{fill:", svg)
              ]
              events = sorted(dict.fromkeys(events))[:MAX_SEGMENTS]
              if not events or '<g class="s">' not in svg:
                  continue

              css = [
                  '<style>',
                  '.growth-segment{shape-rendering:geometricPrecision;fill:var(--cs);opacity:0;}',
              ]
              body = ['<g aria-label="snake growth body">']

              for i, event in enumerate(events, 1):
                  # The segment is hidden until its corresponding contribution
                  # is eaten, then remains visible for the rest of the cycle.
                  before = max(0.0, event - 0.02)
                  css.append(
                      f'@keyframes grow{i}{{0%,{before:.2f}%{{opacity:0}}'
                      f'{event:.2f}%,100%{{opacity:1}}}}'
                  )

                  # The transform follows the original snake path, delayed by
                  # one normal grid step per body segment. This creates a true
                  # longer snake rather than making the snake cells larger.
                  delay = i * SEGMENT_DELAY_MS
                  css.append(
                      f'.growth-{i}{{animation-name:s0,grow{i};'
                      f'animation-duration:{DURATION_MS}ms,{DURATION_MS}ms;'
                      f'animation-timing-function:linear,linear;'
                      f'animation-iteration-count:infinite,infinite;'
                      f'animation-delay:-{delay}ms,0ms;}}'
                  )

                  body.append(
                      f'<rect class="growth-segment growth-{i}" x="0" y="-16" '
                      f'width="16" height="16" rx="3" ry="3" />'
                  )

              body.append('</g>')
              css.append('</style>')

              # Keep the original head on top. The added body is inserted
              # immediately before it and does not alter the contribution grid.
              marker = '<g class="s">'
              insertion = ''.join(css) + ''.join(body)
              svg = svg.replace(marker, insertion + marker, 1)
              path.write_text(svg, encoding='utf-8')

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
