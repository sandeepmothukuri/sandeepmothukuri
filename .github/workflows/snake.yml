name: Generate Snake Animation

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: sandeepmothukuri
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Add normal-size growth segments after eaten contributions
        shell: python
        run: |
          from pathlib import Path
          import re

          DURATION_MS = 20900
          SEGMENT_DELAY_MS = 260
          MAX_SEGMENTS = 80

          for path in Path("dist").glob("github-snake*.svg"):
              svg = path.read_text(encoding="utf-8")
              events = [
                  float(x)
                  for x in re.findall(
                      r'@keyframes c[0-9a-z]+\{([0-9]+(?:\.[0-9]+)?)%\{fill:',
                      svg,
                  )
              ]
              events = sorted(set(events))[:MAX_SEGMENTS]

              if not events:
                  raise SystemExit(f"No contribution eating events found in {path}")

              marker = '<g class="s">'
              if marker not in svg:
                  raise SystemExit(f"Original snake group not found in {path}")

              css = ['<style>']
              body = ['<g aria-label="snake growth body">']

              for i, event in enumerate(events, 1):
                  lag = i * SEGMENT_DELAY_MS
                  before = max(0.0, event - 0.03)
                  css.append(
                      f'.growth-{i}' + '{'
                      f'animation-name:s0,grow{i};'
                      f'animation-duration:{DURATION_MS}ms,{DURATION_MS}ms;'
                      f'animation-timing-function:linear,linear;'
                      f'animation-iteration-count:infinite,infinite;'
                      f'animation-delay:{lag}ms,0ms;'
                      f'animation-fill-mode:backwards,none;'
                      '}'
                  )
                  css.append(
                      f'@keyframes grow{i}' + '{'
                      f'0%,{before:.2f}%{{opacity:0;}}'
                      f'{event:.2f}%,100%{{opacity:1;}}'
                      '}'
                  )
                  body.append(
                      f'<rect class="growth-segment growth-{i}" '
                      'x="0" y="-16" width="16" height="16" rx="3" ry="3" />'
                  )

              body.append('</g>')
              css.append('</style>')
              svg = svg.replace(marker, ''.join(css) + ''.join(body) + marker, 1)
              path.write_text(svg, encoding="utf-8")

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
