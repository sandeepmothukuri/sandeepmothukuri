name: Generate Snake Animation

on:
  schedule:
    - cron: "0 5 * * *"  # daily at 05:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: sandeepmothukuri
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # Make the contribution snake visually larger without changing
      # the contribution grid, timing, colors, or README layout.
      - name: Enlarge contribution snake
        shell: python
        run: |
          from pathlib import Path
          import re

          SCALE = 1.45

          for filename in ("dist/github-snake.svg", "dist/github-snake-dark.svg"):
              path = Path(filename)
              svg = path.read_text(encoding="utf-8")

              def enlarge(match):
                  attrs = match.group(1)

                  def number(name):
                      value = re.search(rf'{name}="([^"]+)"', attrs)
                      return float(value.group(1)) if value else None

                  x = number("x")
                  y = number("y")
                  width = number("width")
                  height = number("height")
                  rx = number("rx")
                  ry = number("ry")

                  if None in (x, y, width, height):
                      return match.group(0)

                  new_width = width * SCALE
                  new_height = height * SCALE
                  new_x = x - (new_width - width) / 2
                  new_y = y - (new_height - height) / 2

                  attrs = re.sub(r'x="[^"]+"', f'x="{new_x:.1f}"', attrs, count=1)
                  attrs = re.sub(r'y="[^"]+"', f'y="{new_y:.1f}"', attrs, count=1)
                  attrs = re.sub(r'width="[^"]+"', f'width="{new_width:.1f}"', attrs, count=1)
                  attrs = re.sub(r'height="[^"]+"', f'height="{new_height:.1f}"', attrs, count=1)

                  if rx is not None:
                      attrs = re.sub(r'rx="[^"]+"', f'rx="{rx * SCALE:.1f}"', attrs, count=1)
                  if ry is not None:
                      attrs = re.sub(r'ry="[^"]+"', f'ry="{ry * SCALE:.1f}"', attrs, count=1)

                  return "<rect" + attrs + "/>"

              # Only resize snake segments (.s.s0, .s.s1, ...), not grid cells.
              svg = re.sub(r'<rect([^>]*class="s s[0-9]+"[^>]*)/>', enlarge, svg)
              path.write_text(svg, encoding="utf-8")

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
