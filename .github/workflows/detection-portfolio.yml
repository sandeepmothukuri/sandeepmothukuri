name: Detection Portfolio

on:
  schedule:
    - cron: "0 7 * * 1"   # Mondays at 07:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/render-detection-portfolio.py"
      - ".github/workflows/detection-portfolio.yml"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  refresh:
    runs-on: ubuntu-latest
    concurrency:
      group: readme-writer
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install --quiet pyyaml
      - name: Render detection portfolio
        run: python3 .github/scripts/render-detection-portfolio.py
      - name: Commit if changed
        run: |
          if git diff --quiet README.md; then
            echo "No changes."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore(detections): weekly portfolio refresh"
          git push origin HEAD:main
