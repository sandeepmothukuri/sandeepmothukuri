name: Build live repository stats

on:
  push:
    paths:
      - '.github/workflows/build-live-repo-stats.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild Featured Labs table with live metrics markers
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('README.md')
          text = p.read_text(encoding='utf-8')

          repos = [
              ('Enterprise-Detection-Engineering-SOC-Lab', '🧬', 'Enterprise Detection Engineering SOC Lab', 'Enterprise detection engineering lab covering SIEM, ElastAlert, Sigma, MITRE ATT&CK, and adversary-focused detections.'),
              ('AI-Augmented-SOC-Lab', '🤖', 'AI-Augmented-SOC-Lab', 'AI-augmented SOC lab for LLM-assisted triage, investigation, automation, and security operations.'),
              ('SOC-Detection-and-Threat-Hunting-Lab', '🎯', 'SOC-Detection-and-Threat-Hunting-Lab', 'SOC detection and threat-hunting lab with practical telemetry, investigations, and ATT&CK-aligned detections.'),
              ('soc-threat-hunting-lab', '🔎', 'soc-threat-hunting-lab', 'Threat-hunting lab focused on hypothesis-driven hunts, telemetry analysis, and defensive investigations.'),
              ('Autonomous-SOC-Lab', '⚙️', 'Autonomous-SOC-Lab', 'Autonomous SOC experimentation covering agentic workflows, enrichment, triage, and response automation.'),
              ('AI-SOC-Decision-Engine', '🤖', 'AI-SOC-Decision-Engine', 'AI-assisted SOC decision engine for evidence-driven alert triage, investigation, risk scoring, and response recommendations.'),
              ('PromptSentinel', '🛡️', 'PromptSentinel', 'Enterprise prompt-injection detection and AI firewall with 22 detectors, OWASP LLM Top 10 coverage, and SIEM-ready output.'),
              ('PromptShield', '🛡️', 'PromptShield', 'Enterprise-grade prompt injection detection and AI firewall for protecting LLM workflows.'),
              ('sentinel-detection-engine', '🧠', 'sentinel-detection-engine', 'Microsoft Sentinel detection engineering portfolio with KQL detections mapped to MITRE ATT&CK.'),
              ('socforge', '🔥', 'SOCForge', 'Evidence-driven SOC platform for alert triage, investigation, detection engineering, and AI-augmented security operations.'),
          ]

          def card(repo, icon, title, description):
              return f'''<td width="50%" valign="top">\n\n### {icon} [{title}](https://github.com/sandeepmothukuri/{repo})\n{description}\n<!-- REPO-METRICS:{repo} START -->\n<sub>📊 metrics collecting — first snapshot pending</sub>\n<!-- REPO-METRICS:{repo} END -->\n\n</td>'''

          rows = []
          for i in range(0, len(repos), 2):
              cells = [card(*item) for item in repos[i:i+2]]
              if len(cells) == 1:
                  cells.append('<td width="50%" valign="top">\n</td>')
              rows.append('<tr>\n' + '\n'.join(cells) + '\n</tr>')

          section = '## 🧪 Featured Labs\n\n<table>\n' + '\n'.join(rows) + '\n</table>'
          pattern = re.compile(r'## 🧪 Featured Labs.*?</table>', re.DOTALL)
          new_text, n = pattern.subn(section, text, count=1)
          if n != 1:
              raise SystemExit('Featured Labs table not found exactly once')
          p.write_text(new_text, encoding='utf-8')
          PY

      - name: Collect and render current metrics
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          bash .github/scripts/snapshot-metrics.sh
          python3 .github/scripts/render-metrics.py

      - name: Commit final profile README and remove temporary workflow
        run: |
          git config user.name 'Sandeep Mothukuri'
          git config user.email 'sandeep.mothukuris@gmail.com'
          git add README.md metrics/history.json
          git commit -m 'feat(profile): show live stats under every tracked repository' || true
          rm -f .github/workflows/build-live-repo-stats.yml
          git add -A
          git commit -m 'chore: remove temporary live stats builder' || true
          git push

# Trigger the one-shot rebuild with a workflow-file update.
