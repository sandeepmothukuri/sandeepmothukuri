name: Profile Metrics (autopilot)

# Daily snapshot of profile views + per-repo traffic. Renders the marker
# blocks in README and commits straight to main — no PR, no manual merge.

on:
  schedule:
    - cron: "30 6 * * *"   # 06:30 UTC, just after the existing traffic-digest run
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/scripts/snapshot-metrics.sh
      - .github/scripts/render-metrics.py

permissions:
  contents: write

env:
  # Opt into Node 24 for actions/checkout & actions/setup-python ahead of
  # the June 2026 default switch, silencing the deprecation warning.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Snapshot today's metrics
        env:
          # GH_PAT needs public_repo scope for traffic data.
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/snapshot-metrics.sh

      - name: Render README
        env:
          # Needed by fetch_github_activity() for commits-this-year + streak
          # via the GraphQL contributionsCollection query.
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/render-metrics.py

      - name: Commit straight to main (autopilot)
        run: |
          if git diff --quiet; then
            echo "Nothing changed; skipping commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics/history.json README.md
          git commit -m "chore(metrics): daily refresh ($(date -u +%Y-%m-%d))"
          git push origin HEAD:main
