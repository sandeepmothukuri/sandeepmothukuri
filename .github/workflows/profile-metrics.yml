name: Profile Metrics (autopilot)

# Daily snapshot of profile views + per-repo traffic. Renders the marker
# blocks in README and commits straight to main — no PR, no manual merge.
# Status timezone: Asia/Kolkata (IST) — never render legacy UK/BST time.

on:
  schedule:
    - cron: "30 6 * * *"   # 06:30 UTC, just after the existing traffic-digest run
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/scripts/snapshot-metrics.sh
      - .github/scripts/render-metrics.py
      - .github/scripts/render-metrics-calendar.py
      - .github/scripts/render-india-status.py
      - .github/workflows/profile-metrics.yml

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Snapshot today's metrics
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/snapshot-metrics.sh

      - name: Render README with exact calendar 30-day windows
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/render-metrics-calendar.py

      - name: Render India timezone status
        run: python3 .github/scripts/render-india-status.py

      - name: Commit straight to main (autopilot)
        run: |
          if git diff --quiet; then
            echo "Nothing changed; skipping commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics/history.json README.md .github/scripts/render-metrics-calendar.py .github/scripts/render-india-status.py .github/workflows/profile-metrics.yml
          git commit -m "chore(metrics): daily refresh ($(date -u +%Y-%m-%d))"
          git push origin HEAD:main
