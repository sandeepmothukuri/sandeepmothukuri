name: Profile Metrics (autopilot)

# Refreshes profile views + per-repo traffic every 5 hours. Renders README metrics
# and the analytics dashboard SVG, then commits generated metrics to main after merge.
# Status timezone: Asia/Kolkata (IST) — never render legacy UK/BST time.

on:
  schedule:
    - cron: "0 */5 * * *"   # Every 5 hours live refresh
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/scripts/snapshot-metrics.sh
      - .github/scripts/snapshot-metrics.py
      - .github/scripts/render-metrics.py
      - .github/scripts/render-metrics-calendar.py
      - .github/scripts/render-india-status.py
      - .github/scripts/render-analytics-dashboard.py
      - .github/workflows/profile-metrics.yml

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Snapshot today's metrics
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/snapshot-metrics.sh

      - name: Render README with exact calendar 30-day windows
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/render-metrics-calendar.py

      - name: Render India timezone status
        run: python3 .github/scripts/render-india-status.py

      - name: Render analytics dashboard from stored metrics
        run: python3 .github/scripts/render-analytics-dashboard.py

      - name: Commit straight to main (autopilot)
        run: |
          if git diff --quiet; then
            echo "Nothing changed; skipping commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics/history.json metrics/traffic-baseline.json README.md assets/analytics-dashboard.svg .github/scripts/ .github/workflows/profile-metrics.yml
          git commit -m "chore(metrics): live refresh ($(date -u +'%Y-%m-%d %H:%M UTC'))" || true
          git pull --rebase origin main || true
          git push origin HEAD:main
