name: Update Blog Posts

on:
  schedule:
    - cron: "0 8 * * *"   # daily at 08:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: gautamkrishnar/blog-post-workflow@v1
        continue-on-error: true
        with:
          max_post_count: 5
          feed_list: "https://cybertechnology.in/feed/,https://cybertechnology.in/rss/,https://cybertechnology.in/feed.xml,https://cybertechnology.in/rss.xml,https://cybertechnology.in/atom.xml"
          template: "- [$title]($url) — $date"
          date_format: "mmm dd, yyyy"
          commit_message: "chore: refresh latest blog posts"
          retry_count: 2
          retry_wait_time: 5
