name: Anti-Plagiarism & IP Surveillance

on:
  schedule:
    - cron: "0 4 * * 1"   # Mondays at 04:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/detect-plagiarism.py'
      - '.github/workflows/plagiarism-guard.yml'
      - 'DMCA.md'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  plagiarism-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Anti-Plagiarism & IP Surveillance
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/detect-plagiarism.py
